<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solana Heat — an open-world crime game in Port Solana</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solana Heat: explore Port Solana on foot and by car. WASD or arrow keys move, E enters a car, mouse aims, click shoots, T calls a taxi fare, Esc pauses."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
